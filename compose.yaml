services:
  hachicats:
    build: .
    image: hachicats:local
    container_name: hachicats
    restart: unless-stopped
    ports:
      - "127.0.0.1:5188:3000"
    env_file: .env.production
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      APP_ORIGIN: https://hachicats.ourtaiko.org
      SSO_ISSUER: https://sso.ourtaiko.org
      ADMIN_USERNAME: kirisamevanilla
      DATABASE_PATH: /app/data/hachicats.sqlite
    volumes:
      - hachicats-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  hachicats-data:
    name: hachicats-data
